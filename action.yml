name: PatchProof
description: Audit AI-generated code diffs for security and quality issues.
author: juanitourquiza

inputs:
  mode:
    description: Use `npm` for published package execution or `local` for the checked-out repository.
    required: false
    default: npm
  version:
    description: PatchProof version to run when mode is `npm`.
    required: false
    default: 0.1.0
  working-directory:
    description: Directory where the diff should be audited.
    required: false
    default: .
  diff-path:
    description: Optional unified diff file. If omitted, the action audits `git diff`.
    required: false
    default: ''
  format:
    description: Report format.
    required: false
    default: text
  lang:
    description: Report language.
    required: false
    default: en
  fail-on:
    description: Minimum severity that should fail the action.
    required: false
    default: high

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install local dependencies
      if: inputs.mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Build local CLI
      if: inputs.mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run build

    - name: Run PatchProof
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.diff-path }}" ]; then
          DIFF_FLAG=(--file "${{ inputs.diff-path }}")
        else
          DIFF_FLAG=(--diff)
        fi

        if [ "${{ inputs.mode }}" = "local" ]; then
          node packages/cli/dist/index.js audit "${DIFF_FLAG[@]}" --format "${{ inputs.format }}" --lang "${{ inputs.lang }}" --fail-on "${{ inputs.fail-on }}"
        else
          npx --yes "patchproof@${{ inputs.version }}" audit "${DIFF_FLAG[@]}" --format "${{ inputs.format }}" --lang "${{ inputs.lang }}" --fail-on "${{ inputs.fail-on }}"
        fi
